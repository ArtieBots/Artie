version: 2.1

executors:
  ubuntu-executor:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
  small-ubuntu-executor:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
  arm-executor:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: arm.medium

commands:
  setup:
    description: "Set up environment variables, install dependencies, and log in to Docker Hub."
    steps:
      - run:
          name: Set up Docker Environment Variables
          command: |
            echo "export DOCKER_TAG=${CIRCLE_SHA1:0:8}" >> $BASH_ENV
            echo "export DOCKER_REPO=maxfieldstrange" >> $BASH_ENV
      - run:
          name: Install Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip
      - run:
          name: Install Python Requirements
          command: |
            pip install -r ./requirements.txt
          working_directory: framework
      - run:
          name: Docker Login
          command: |
            echo "$DOCKERHUB_PAT" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

jobs:
  # Each architecture builds natively on its own executor (no QEMU emulation).
  # arm64 builds after amd64 because the drivers' arm64 images consume firmware
  # artifacts produced by the (amd64-only) firmware builder images.
  build-amd64:
    executor: ubuntu-executor
    steps:
      - checkout
      - setup
      - run:
          name: Build All (amd64)
          command: |
            docker buildx create --use
            python3 artie-tool.py build all --enable-error-tracing --docker-repo $DOCKER_REPO --force-build --docker-tag $DOCKER_TAG --fail-fast --platforms linux/amd64
          working_directory: framework
      - persist_to_workspace:
          root: .
          paths:
            - build-artifacts

  build-arm64:
    executor: arm-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup
      - run:
          name: Build All (arm64)
          command: |
            docker buildx create --use
            python3 artie-tool.py build all --enable-error-tracing --docker-repo $DOCKER_REPO --force-build --docker-tag $DOCKER_TAG --fail-fast --platforms linux/arm64
          working_directory: framework

  # Multi-arch manifests are assembled from the already-pushed per-arch images.
  # Without --force-build or --platforms, everything already pushed is treated as
  # cached, so only the manifest steps do real work here.
  assemble-manifests:
    executor: small-ubuntu-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup
      - run:
          name: Assemble Multi-Arch Manifests
          command: |
            docker buildx create --use
            python3 artie-tool.py build all --enable-error-tracing --docker-repo $DOCKER_REPO --docker-tag $DOCKER_TAG --fail-fast
          working_directory: framework

  test-sanity:
    executor: arm-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup
      - run:
          name: Run Sanity Tests
          command: |
            python3 artie-tool.py test all-sanity --enable-error-tracing --docker-repo $DOCKER_REPO --docker-tag $DOCKER_TAG --docker-logs --nprocs 1 --output testlog-sanity.txt --test-timeout-s 120 --junit-xml junit-results/sanity.xml
          working_directory: framework
          no_output_timeout: 5m
      - store_test_results:
          path: framework/junit-results
      - store_artifacts:
          path: framework/testlog-sanity.txt

  test-unit:
    executor: arm-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup
      - run:
          name: Run Unit Tests
          command: |
            python3 artie-tool.py test all-unit --enable-error-tracing --docker-repo $DOCKER_REPO --docker-tag $DOCKER_TAG --docker-logs --nprocs 1 --output testlog-unit.txt --test-timeout-s 120 --junit-xml junit-results/unit.xml
          working_directory: framework
          no_output_timeout: 5m
      - store_test_results:
          path: framework/junit-results
      - store_artifacts:
          path: framework/testlog-unit.txt

  test-integration:
    executor: arm-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup
      - run:
          name: Run Integration Tests
          command: |
            python3 artie-tool.py test all-integration --enable-error-tracing --docker-repo $DOCKER_REPO --docker-tag $DOCKER_TAG --docker-logs --nprocs 1 --output testlog-integration.txt --test-timeout-s 120 --junit-xml junit-results/integration.xml
          working_directory: framework
          no_output_timeout: 5m
      - store_test_results:
          path: framework/junit-results
      - store_artifacts:
          path: framework/testlog-integration.txt

workflows:
  artie-build-and-test:
    jobs:
      - build-amd64:
          context:
            - docker-hub
      - build-arm64:
          requires:
            - build-amd64
          context:
            - docker-hub
      - assemble-manifests:
          requires:
            - build-arm64
          context:
            - docker-hub
      - test-sanity:
          requires:
            - build-arm64
          context:
            - docker-hub
      - test-unit:
          requires:
            - build-arm64
          context:
            - docker-hub
      - test-integration:
          requires:
            - build-arm64
          context:
            - docker-hub
