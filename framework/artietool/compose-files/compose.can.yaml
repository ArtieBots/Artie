name: can-integration-test
networks:
  can-itest:
    external: true

# Two long-lived Artie CAN peer nodes, each in its own container, sharing a UDP multicast bus over
# the can-itest bridge network. The third node (address 0x01) is the one-shot scenario driver that
# the can-integration-tests task runs per test step, so it is not declared here.
#
# Node addresses must stay unique across all three: the UDP multicast backend filters out its own
# traffic by comparing each frame's source address against its own node address, so two nodes
# sharing an address would silently discard each other's frames.
services:
  can-node-2:
    container_name: can-itest-node-2
    image: ${ARTIE_CAN_TEST_IMAGE}
    command: /artie-can/build/itest/itest_node --role peer --address 0x02
    networks:
      - can-itest
    environment:
      - ARTIE_RUN_MODE=integration
      - ARTIE_LOG_LEVEL=DEBUG
    healthcheck:
      test: ["CMD-SHELL", "pgrep itest_node > /dev/null || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s

  can-node-3:
    container_name: can-itest-node-3
    image: ${ARTIE_CAN_TEST_IMAGE}
    command: /artie-can/build/itest/itest_node --role peer --address 0x03
    networks:
      - can-itest
    environment:
      - ARTIE_RUN_MODE=integration
      - ARTIE_LOG_LEVEL=DEBUG
    healthcheck:
      test: ["CMD-SHELL", "pgrep itest_node > /dev/null || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s
